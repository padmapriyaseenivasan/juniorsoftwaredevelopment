<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry formula</title>
</head>
<body>
    <table border="5px" height="50%" width="50%" bgcolor="lightblue">
        <tr><th>name</th>
        <th>formula</th>
    </tr>
    <tr>
        <td>carbon carbonate</td>
        <td>CaCO<sub>2</sub></td>
    </tr>
    <tr>
        <td>sodium Hydrogencarbonate</td>
        <td>NaHCO<sub>2</sub></td>
    </tr>
    <tr>
        <td>Amonia</td>
        <td>NH<sub>2</sub></td>
    </tr>
    </table>
</body>
</html>
